# Fork-only verification. No publishing, signing, upstream PR or automatic merge.
name: Deterministic quality

on:
  push:
    branches: [main, 'test/**', 'fix/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deterministic-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"

jobs:
  foundation:
    name: Linux / time and bitstream
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: deterministic-foundation
      - name: Formatting
        run: cargo fmt --all -- --check
      - name: Half-open interval regression (standalone)
        run: cargo test --locked -p filmcraft-time --test range_contract
      - name: Foundation crate tests
        run: cargo test --locked -p filmcraft-time -p filmcraft-bitstream
      - name: Foundation Clippy
        run: cargo clippy --locked -p filmcraft-time -p filmcraft-bitstream --all-targets -- -D warnings

  coverage:
    name: Linux / measured foundation coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: deterministic-coverage
      - name: Install LLVM coverage tool
        run: cargo install cargo-llvm-cov --locked
      - name: Collect instrumented coverage (no threshold before baseline)
        run: cargo llvm-cov --locked -p filmcraft-time -p filmcraft-bitstream --lcov --output-path coverage.lcov
      - name: Upload coverage evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: foundation-coverage
          path: coverage.lcov
          if-no-files-found: warn
          retention-days: 30

  workspace:
    name: Linux / full workspace (manual)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: deterministic-workspace
      - name: Native build and oracle dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev libxkbcommon-dev libwayland-dev libx11-dev \
            libxrandr-dev libxi-dev libgl1-mesa-dev ffmpeg pkg-config
      - name: Workspace tests with required local oracles
        env:
          FILMCRAFT_REQUIRE_ORACLES: "1"
        run: cargo test --workspace --locked
      - name: Workspace Clippy
        run: cargo clippy --workspace --locked --all-targets -- -D warnings
      - name: Dependency layering
        run: cargo xtask layers
      - name: Asset attribution
        run: cargo xtask assets
      - name: WASM compile gate
        run: cargo xtask wasm
